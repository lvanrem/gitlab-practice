apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{.Release.Name}}-api"
  labels:
    app: nginx
    instance: {{.Release.Name}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nginx
      instance: {{.Relase.Name}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nginx
        instance: {{.Relase.Name}}
    spec:
      containers:
        - name: nginx
          image: "nginx:{{ .Values.nginxVersion }}"
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: {{ .Values.cpuLimit }}
              memory: {{ .Values.memoryLimit }}
            requests:
              memory: {{ .Values.memoryRequest }}
              cpu: {{ .Values.cpuRequest }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath }}
              port: 80
            periodSeconds: 5